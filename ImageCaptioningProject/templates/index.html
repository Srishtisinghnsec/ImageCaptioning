{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="text-center">Upload an Image</h1>
        <form action="/predict" method="POST" enctype="multipart/form-data" class="mt-4">
            <div class="mb-3">
                <label for="image" class="form-label">Choose an image</label>
                <input type="file" class="form-control" name="image" id="image" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Classify</button>
        </form>
    </div>
</div>
<div class="row justify-content-center mt-4">
    <div class="col-md-6 text-center">
        {% if result %}
        <h3 class="alert alert-success">Prediction: {{ result }}</h3>
        {% endif %}
    </div>
</div>
{% endblock %}
